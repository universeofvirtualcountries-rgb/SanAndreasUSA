### This file belongs at .github/workflows/build_android.yml ###
### The repo's GitHub App token cannot push workflow files, so it is kept
### here and copied into place once - see ci/INSTALL_CI.md. ###
name: Build libUSA1to1.so

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r27d
  NDK_FULL: 27.3.13750724
  ANDROID_PLATFORM: android-24
  CMAKE_VERSION: 3.22.1

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (host)
        run: cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release

      - name: Build (host)
        run: cmake --build build-host -j"$(nproc)"

      - name: Run unit tests
        run: ./build-host/usa1to1_tests

      - name: Validate tooling (parse_ide self-test)
        run: |
          python3 -m py_compile tools/parse_ide.py
          python3 tools/parse_ide.py --self-test

      - name: Validate JSON assets
        run: |
          for f in assets/manifest.json assets/objects_db.sample.json assets/missions/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

  android:
    name: Android ${{ matrix.abi }}
    needs: host-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            api: 24
          - abi: armeabi-v7a
            api: 24
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (NDK tooling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Verify NDK
        run: |
          echo "NDK at ${{ steps.ndk.outputs.ndk-path }}"
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" --version || true
          ls "${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake"

      - name: Configure (${{ matrix.abi }})
        run: |
          cmake -S . -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.api }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (${{ matrix.abi }})
        run: cmake --build build-${{ matrix.abi }} -j"$(nproc)"

      - name: Check binary
        run: |
          ls -lh build-${{ matrix.abi }}/libUSA1to1.so
          file build-${{ matrix.abi }}/libUSA1to1.so
          # The mod must not export ImGui/libc++ symbols: AML loads dozens of mods.
          echo "--- exported symbols (first 20) ---"
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D --defined-only build-${{ matrix.abi }}/libUSA1to1.so | head -20

      - name: Stage artifact
        run: |
          mkdir -p artifact/lib/${{ matrix.abi }}
          cp build-${{ matrix.abi }}/libUSA1to1.so artifact/lib/${{ matrix.abi }}/
          cp -r assets artifact/
          cp README.md artifact/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: USA1to1-${{ matrix.abi }}
          path: artifact/
          if-no-files-found: error

  # Single download containing both ABIs plus the JSON assets, ready to unzip
  # into /sdcard/AMLMods/<game>/USA1to1/.
  package:
    name: Package mod (both ABIs)
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: USA1to1-*
          path: merged

      - name: Assemble USA1to1.zip
        run: |
          mkdir -p package/lib/arm64-v8a package/lib/armeabi-v7a
          cp merged/USA1to1-arm64-v8a/lib/arm64-v8a/libUSA1to1.so package/lib/arm64-v8a/
          cp merged/USA1to1-armeabi-v7a/lib/armeabi-v7a/libUSA1to1.so package/lib/armeabi-v7a/
          cp -r assets package/assets
          cp docs/MOD_INSTALL.md package/README_INSTALL.md
          cd package && zip -r ../USA1to1.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: USA1to1-full
          path: USA1to1.zip
          if-no-files-found: error
